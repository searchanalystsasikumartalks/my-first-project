# Read-only runtime preflight only. Does not deploy apps or update catalog files.
# Restore/revise this diagnostic hook deliberately after reviewing its receipt.
deployment:
  tasks:
    - >-
      /opt/alt/python311/bin/python3.11 -I -S -B -c 'import sys,os,json,stat,hashlib,fcntl; assert sys.version_info >= (3,8), "Python 3.8+ required"; root="/home/dzfbipjkvhxg/public_html/appln"; assert os.path.realpath(root)==root, "Unexpected real path"; names=["index.html","manifest.json","sitemap.xml"]; paths=[os.path.join(root,n) for n in names]; assert all(stat.S_ISREG(os.lstat(p).st_mode) and os.lstat(p).st_nlink==1 and os.lstat(p).st_size<=5242880 for p in paths), "Unsafe catalog file"; print(json.dumps({"check":"catalog-runtime-preflight-v1","python":sys.version,"executable":sys.executable,"fcntl":True,"root_writable":os.access(root,os.W_OK),"files":[{"name":n,"sha256":hashlib.sha256(open(p,"rb").read()).hexdigest(),"writable":os.access(p,os.W_OK),"mode":oct(stat.S_IMODE(os.lstat(p).st_mode))} for n,p in zip(names,paths)]},sort_keys=True))'
