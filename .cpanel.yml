# Check only: reads live catalog and Rocket. Never applies catalog changes.
# Creates owner-only private updater state/lock outside public_html.
# Account home is discovered locally; no account identifier is stored here.
deployment:
  tasks:
    - >-
      /opt/alt/python311/bin/python3.11 -I -S -B -c 'import sys,os,pwd,stat,hashlib,runpy; home=pwd.getpwuid(os.geteuid()).pw_dir; p=os.path.join(home,"repositories","github-transfer-test-20261108","deployment","catalog-updater-v1"); assert os.path.realpath(p)==p, "Unexpected package path"; assert os.stat(p).st_uid==os.geteuid() and os.stat(p).st_mode&0o022==0, "Unsafe package directory ownership or mode"; pins={"catalog_updater.py":"f4986a0d27b73bd3a021793eb7c8e98974d1ccf71cf61258577321d35e92953a","catalog_plan.py":"f45cd768fc4da454c8645f4409e569684aa7fb568ede9f545b9a687a9436ca81","html_checks.py":"281213a78713a80993d191d785d2336f7b6b6ce1d8569b3fb2c4de29d2833aec","rocket.json":"1d1cc8037b84df81bf057c633b40a7f18d1dd8b873b19e4ccaa2277ba0da3b5c"}; assert set(os.listdir(p))==set(pins), "Unexpected package files"; assert all(stat.S_ISREG(os.lstat(p+"/"+n).st_mode) and os.lstat(p+"/"+n).st_uid==os.geteuid() and os.lstat(p+"/"+n).st_mode&0o022==0 and os.lstat(p+"/"+n).st_nlink==1 and os.lstat(p+"/"+n).st_size<1048576 for n in pins), "Unsafe package file"; assert all(hashlib.sha256(open(p+"/"+n,"rb").read()).hexdigest()==h for n,h in pins.items()), "Package integrity mismatch"; sys.path.append(p); sys.argv=[p+"/catalog_updater.py","check","--app-metadata",p+"/rocket.json"]; runpy.run_path(sys.argv[0],run_name="__main__")'
